name: Backend and Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend static checks and test collection
    runs-on: ubuntu-latest
    env:
      # Test modules must never fall back to the live preview deployment.
      API_BASE_URL: http://127.0.0.1:8001/api
      REACT_APP_BACKEND_URL: http://127.0.0.1:8001
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: salonehcm_ci
      JWT_SECRET: ci-only-signing-secret
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-ci.txt

      - name: Lint backend for syntax errors and undefined names
        run: python -m flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Compile backend
        run: python -m compileall -q backend

      # This focused workpaper test is offline and safe to execute when a PR adds it.
      - name: Run isolated NASSIT workpaper unit test when present
        run: |
          if [ -f backend/tests/test_nassit_workpaper.py ]; then
            python -m pytest -q backend/tests/test_nassit_workpaper.py
          fi

      - name: Run isolated payroll variance unit test when present
        run: |
          if [ -f backend/tests/test_payroll_variance_unit.py ]; then
            python -m pytest -q backend/tests/test_payroll_variance_unit.py
          fi

      - name: Run isolated mobile-money routing unit test when present
        run: |
          if [ -f backend/tests/test_mobile_money_routing.py ]; then
            python -m pytest -q backend/tests/test_mobile_money_routing.py
          fi

      # The remaining suite includes deployment and provider integration tests.
      # Collect those tests without executing requests or sending test email.
      - name: Collect backend tests
        run: python -m pytest --collect-only -q backend/tests

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install Yarn 1.22.22
        run: npm install --global yarn@1.22.22

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: http://127.0.0.1:8001
        run: yarn build
