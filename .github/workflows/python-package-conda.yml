name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend static checks and test collection
    runs-on: ubuntu-latest
    env:
      # Test modules must never fall back to the live preview deployment.
      API_BASE_URL: http://127.0.0.1:8001/api
      REACT_APP_BACKEND_URL: http://127.0.0.1:8001
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: salonehcm_ci
      JWT_SECRET: ci-only-signing-secret
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-ci.txt

      - name: Lint backend for syntax errors and undefined names
        run: python -m flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Compile backend
        run: python -m compileall -q backend

      # The current pytest suite includes deployment and provider integration tests.
      # Collect tests here without executing requests or sending test email.
      - name: Collect backend tests
        run: python -m pytest --collect-only -q backend/tests
